server.port=8080

spring.application.name=api-gateway

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service

spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE

spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=resume-service

spring.cloud.gateway.server.webmvc.routes[1].uri=lb://RESUME-SERVICE

spring.cloud.gateway.server.webmvc.routes[1].predicates[1]=Path=/api/v1/resume/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.config.import=optional:configserver:http://localhost:8888
