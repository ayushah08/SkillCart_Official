spring.application.name=config-server

server.port=${PORT:8888}
server.address=0.0.0.0

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

# GitHub Config Repository
spring.cloud.config.server.git.uri=https://github.com/ayushah08/skillcart-config-repo

spring.cloud.config.server.git.username=ayushah08git push origin master
spring.cloud.config.server.git.password=${GITHUB_TOKEN}

spring.cloud.config.server.git.default-label=main

spring.cloud.config.server.git.clone-on-start=true